databaseChangeLog:
  - changeSet:
      id: 007-create-schedules
      author: ikabatov
      changes:
        - createTable:
            tableName: schedules
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: group_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_schedules_group
                    references: groups(id)
                    deleteCascade: true
              - column:
                  name: course_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_schedules_course
                    references: courses(id)
                    deleteCascade: true
              - column:
                  name: date_start
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: date_end
                  type: timestamp
                  constraints:
                    nullable: false


