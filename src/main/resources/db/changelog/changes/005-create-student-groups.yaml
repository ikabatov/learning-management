databaseChangeLog:
  - changeSet:
      id: 005-create-student-groups
      author: ikabatov
      changes:
        - createTable:
            tableName: student_groups
            columns:
              - column:
                  name: student_id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_student_groups_student
                    references: students(id)
                    deleteCascade: true
              - column:
                  name: group_id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_student_groups_group
                    references: groups(id)
                    deleteCascade: true